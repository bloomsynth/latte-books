# Builds the installers when a version tag is pushed, and attaches them to a draft release
# with checksums and the tag's notes from CHANGELOG.md. Run it by hand (Actions → Release →
# Run workflow) to build the installers without releasing; they're kept as the run's
# artifacts. Run it by hand on main with "Tag and make a draft release" ticked to release
# without pushing a tag, such as from a phone: once the installers are built, it tags the
# commit with Cargo.toml's version and makes the same draft release. The installers aren't
# signed yet (docs/PLAN.md §6).
#
# Updates: with the CARGO_PACKAGER_SIGN_PRIVATE_KEY and _PASSWORD secrets set, cargo-packager
# signs what the app updates itself with (Windows' installer, macOS' app as a .tar.gz, the
# AppImage), and the release gets latest.json, which the app reads from
# releases/latest/download/latest.json (crates/latte-ui/src/updater.rs).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Tag main with Cargo.toml's version and make a draft release
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # What this run is: a release, and of which version and tag, or a trial build. Checked
  # first, so a release that can't be made stops before the long build.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version, tag and changelog
        id: check
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag must match the version in Cargo.toml, which the app shows in its sidebar.
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
              exit 1
            fi
            release=true
          elif [ "$RELEASE_INPUT" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is made from main; this run is on $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag already exists. Set the next version in Cargo.toml first"
              exit 1
            fi
            release=true
          fi
          if [ "$release" = true ] && ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "Release: $release, version $version, tag $tag"
          {
            echo "release=$release"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            formats: nsis
          - os: macos-latest
            name: macos
            # app: the app bundle on its own, which updates are made from.
            formats: app,dmg
          # The oldest Ubuntu runner, so the .deb and AppImage run on older glibc too.
          - os: ubuntu-22.04
            name: linux
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # GPUI's build needs these on Linux.
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libasound2-dev libssl-dev libzstd-dev

      # rust-toolchain.toml picks the toolchain.
      - uses: Swatinem/rust-cache@v2

      # Pinned: crates/latte-app/installer.nsi is this version's Windows template, changed.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # A release needs the key, or installs couldn't update to it. A run by hand, or a
      # fork's, can go without: its installers just can't be offered as updates.
      - name: Use the update signing key
        shell: bash
        env:
          KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          if [ -n "$KEY" ]; then
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = true ]; then
            echo "::error::The CARGO_PACKAGER_SIGN_PRIVATE_KEY secret isn't set, so this release couldn't be offered as an update"
            exit 1
          else
            echo "::warning::No update signing key: this build can't be offered as an update"
          fi

      - name: Make installers
        # The AppImage tools need FUSE, which runners don't have.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        # Each system makes only its own installers: cargo-packager would otherwise try
        # the Windows installer on macOS and Linux too.
        run: cargo packager --release -p latte-app --formats ${{ matrix.formats }}

      # Windows signing through SignPath goes here once the project is approved.

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/packages/*.exe
            target/packages/*.dmg
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.app.tar.gz
            target/packages/*.sig

  release:
    needs: [prepare, package]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The same names in every release, so the README's download buttons can link to
      # releases/latest/download/<name>. The version is in the release's title. Each
      # update file keeps its signature beside it; the .dmg and .deb aren't updates.
      - name: Name the installers
        working-directory: dist
        run: |
          ls -l
          mv *.exe.sig Latte-Books-Windows-x64-Setup.exe.sig
          mv *.exe Latte-Books-Windows-x64-Setup.exe
          mv *.app.tar.gz.sig Latte-Books-macOS-arm64.app.tar.gz.sig
          mv *.app.tar.gz Latte-Books-macOS-arm64.app.tar.gz
          mv *.AppImage.sig Latte-Books-Linux-x86_64.AppImage.sig
          mv *.AppImage Latte-Books-Linux-x86_64.AppImage
          rm -f *.dmg.sig *.deb.sig
          mv *.dmg Latte-Books-macOS-arm64.dmg
          mv *.deb Latte-Books-Linux-amd64.deb
          ls -l

      # The notes are this version's section of CHANGELOG.md.
      - name: Write the release notes
        run: |
          version="$VERSION"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found
          ' CHANGELOG.md > section.md
          # GitHub shows each line break in release notes, so join the changelog's
          # wrapped lines back into their paragraphs and list items.
          awk '
            /^$/ || /^#/ || /^[-*] / || /^[0-9]+\. / || /^```/ || /^\|/ {
              if (line != "") print line; line = ""
              if (/^$/ || /^#/ || /^```/ || /^\|/) { print; next }
              line = $0; next
            }
            { sub(/^ +/, ""); line = (line == "") ? $0 : line " " $0 }
            END { if (line != "") print line }
          ' section.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat notes.md

      # What the app checks for updates: the version, these notes, and each system's file
      # with its signature.
      - name: Write latest.json
        working-directory: dist
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sig() { tr -d '\r\n' < "$1"; }
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes ../notes.md \
            --arg base "$base" \
            --arg windows "$(sig Latte-Books-Windows-x64-Setup.exe.sig)" \
            --arg macos "$(sig Latte-Books-macOS-arm64.app.tar.gz.sig)" \
            --arg linux "$(sig Latte-Books-Linux-x86_64.AppImage.sig)" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": {
                  url: "\($base)/Latte-Books-Windows-x64-Setup.exe",
                  signature: $windows,
                  format: "nsis"
                },
                "macos-aarch64": {
                  url: "\($base)/Latte-Books-macOS-arm64.app.tar.gz",
                  signature: $macos,
                  format: "app"
                },
                "linux-x86_64": {
                  url: "\($base)/Latte-Books-Linux-x86_64.AppImage",
                  signature: $linux,
                  format: "appimage"
                }
              }
            }' > latest.json
          cat latest.json

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Lets anyone check an installer was built here from this commit:
      # gh attestation verify <file> --repo bloomsynth/latte-books
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      # A release run by hand tags the commit it built, now the installers are ready. A tag
      # pushed with this workflow's token doesn't start the workflow again.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: true
          # Never a pre-release, even for a beta: releases/latest, which the README's
          # download buttons link to, skips pre-releases.
          prerelease: false
          make_latest: true
          body_path: notes.md
          files: dist/*

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
latte-schema = { path = "crates/latte-schema" }
latte-db = { path = "crates/latte-db" }
latte-core = { path = "crates/latte-core" }
latte-i18n = { path = "crates/latte-i18n" }
latte-print = { path = "crates/latte-print" }
latte-regional = { path = "crates/latte-regional" }
latte-ui = { path = "crates/latte-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

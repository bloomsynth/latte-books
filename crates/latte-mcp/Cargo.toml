[package]
name = "latte-mcp"
description = "Dime: lets AI assistants work in a Latte Books company file"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "latte-mcp"
path = "src/main.rs"

[dependencies]
latte-core.workspace = true
latte-db.workspace = true
latte-schema.workspace = true
latte-i18n.workspace = true
latte-templates.workspace = true
base64 = "0.23"
jiff.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit = "0.25"

# The product name and version in the .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# The tests lay out print jobs in the test itself, where the app runs them for an
# assistant.
[dev-dependencies]
latte-print.workspace = true

[package]
name = "latte-print"
description = "Typst rendering of invoices, payments and shipments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
latte-core.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
base64 = "0.23"
jiff.workspace = true
latte-db.workspace = true
latte-schema.workspace = true
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts"] }

description = "Phase 0 spike: time from launch to the first painted GPUI window"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Kept out of the main workspace so CI doesn't build GPUI until latte-ui needs it.
[workspace]

